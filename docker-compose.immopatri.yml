# ImmoPatri — services additionnels opt-in (DAT v1.0, Partie 3.2 / Sprint 0)
#
# Stockage fichiers chiffre (MinIO) + monitoring disponibilite (Uptime Kuma).
# Opt-in explicite (pas un override auto-fusionne) :
#   docker compose -f docker-compose.yml -f docker-compose.immopatri.yml up -d
#
# Renseignez MINIO_ROOT_USER / MINIO_ROOT_PASSWORD via le .env (jamais en dur).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  minio_data:
  uptime_kuma_data:
