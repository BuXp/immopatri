# ImmoPatri — Reverse proxy Nginx durci (DAT v1.0, Partie 3.6)
# Place dans /etc/nginx/sites-available/immopatri.conf puis lie dans sites-enabled.
# Le certificat TLS est gere par Certbot (certbot --nginx -d immopatri.example.com).

server {
    listen 80;
    server_name immopatri.example.com;
    # Redirige tout le trafic vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name immopatri.example.com;

    # ssl_certificate / ssl_certificate_key sont injectes par Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # En-tetes de securite (DAT 3.6)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
